[project]
name = "teclado-lindinho-bot"
version = "0.1.0"
description = "Bot de Discord que toca um teclado MIDI ao vivo numa call de voz"
requires-python = ">=3.14"
dependencies = [
    "davey>=0.1.7,<0.2",
    "discord-py[voice]>=2.6",
    "mido>=1.3.3",
    "numpy>=2.5.4",
    "pyfluidsynth>=1.4.0",
    "python-dotenv>=1.2.4",
    "python-rtmidi>=1.5.8",
]
